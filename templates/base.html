{%load static%}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{%static 'portfolio_base_style.css'%}">
    <link rel="stylesheet" href="{%static 'css/postform.css' %}">
    <link rel="icon" type="image/x-icon" href="{%static 'system/icon_davi.png'%}">

    {%block head%}
    {%endblock%}

    <title>{%block title%}Portflow{%endblock%}</title>
</head>
<body>
    <header  class="d-flex flex-row w-100">
        <div  class="d-flex row p-5 align-items-center w-100">
            <div class="col">

                <a class="navbar-brand"  href="{%url 'index'%}"><img width="50" src="{%static 'system/icon_davi.png'%}" alt=""></a>

            </div>

            <div class="col-6 mx-5">
                <form action="" class="search-input px-5 d-flex align-items-center " method="get">
                    <i class="bi bi-search"></i>
                    <input type="text" class="text-input mx-2" name="search" id="search" placeholder="search">
                </form>
            </div>

            <div class="col">
                <a class="d-flex justify-content-center" href="{%url 'postPost'%}"><i style="font-size: 3rem; color: #505054;" class="bi bi-file-arrow-up-fill"></i></a>
            </div>

            <div class="col">
                {%if request.user.is_authenticated%}
                <div class="dropdown">
                    <button class="btn btn-dark dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                      Dropdown button
                    </button>
                    <ul class="dropdown-menu">
                      <li><a class="dropdown-item" href="{% url 'profile_index' request.user.profile.id%}">Perfil</a></li>
                      <li>
                            <form class="dropdown-item" action="{%url 'logout'%}" method="post">
                                {%csrf_token%}
                                <button type="submit">sair</button>
                            </form>
                        </li>
                    </ul>
                  </div>
                  {%else%}
                  <a href="{%url 'login'%}">login</a>
                  {%endif%}
                
            </div>

        </div>
    </header>
    {%block content%}{%endblock%}



    {%block scripts%}{%endblock%}


    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
</body>
</html>
