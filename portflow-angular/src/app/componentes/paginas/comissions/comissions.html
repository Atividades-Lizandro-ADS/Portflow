<div class="comissions-page">
  <app-navbar />

  <div class="comissions-header">
    <h1 class="comissions-title">Comissions</h1>
  </div>

  <div class="comissions-tabs">
    <app-switch [options]="tabOptions" [active]="tab()" (change)="onTabChange($event)" />
  </div>

  @if (tab() === 'chats') {
    <div class="comissions-empty">Nenhum chat por aqui ainda.</div>
  }

  @if (tab() === 'tiers') {
    <div class="comissions-tier-list">
      @for (tier of profile()?.commission_tiers ?? []; track tier.id) {
        <app-tier-cards [tier]="tier" (click)="selectedTier.set(tier)" />
      }
      @if (!loading() && !(profile()?.commission_tiers ?? []).length) {
        <p class="comissions-empty-inline">Nenhum tier cadastrado ainda.</p>
      }
      <a routerLink="/comission-tier-form" class="comissions-add-tier-btn">
        <i class="bi bi-plus-lg"></i>
        <span>Adicionar tier</span>
      </a>
    </div>
  }

  <app-tier-detail-modal
    [visible]="!!selectedTier()"
    [tier]="selectedTier()"
    (close)="selectedTier.set(null)"
  />
</div>
