<div class="container">
  <app-navbar />

  <div style="padding: 24px; display: flex; gap: 8px;">
    <app-toggle-btn
      [active]="true"
      endpoint="/api/posts/1/like/"
      iconOn="bi-heart-fill"
      iconOff="bi-heart"
    />
    <app-toggle-btn
      [active]="false"
      endpoint="/api/posts/1/favorite/"
      iconOn="bi-bookmark-fill"
      iconOff="bi-bookmark"
    />
  </div>

  <div style="padding: 24px; display: flex; flex-direction: column; gap: 12px; max-width: 320px;">
    <app-basic-btn label="Entrar" type="submit" />
    <app-basic-btn label="Cadastrar" type="submit" />
    <app-basic-btn label="Carregando..." [loading]="true" />
    <app-basic-btn label="Desabilitado" [disabled]="true" />
  </div>

  <div style="padding: 24px; display: flex; flex-direction: column; gap: 12px; max-width: 320px;">
    <app-text-input placeholder="Usuário ou e-mail" type="email" autocomplete="email" />
    <app-text-input placeholder="Senha" type="password" autocomplete="current-password" />
    <app-text-input placeholder="Título da obra" [maxLength]="150" />
    <app-text-input placeholder="Descreva sua obra em detalhes..." [multiline]="true" />
  </div>

  <div style="padding: 24px; max-width: 480px;">
    <app-search-input />
  </div>

  @if (firstPost(); as post) {
    <div style="padding: 24px; width: 280px;">
      <app-post-card [post]="post" />
    </div>
  }

  @if (postDetail(); as detail) {
    @if (detail.marmoview) {
      <div style="padding: 24px; max-width: 720px;">
        <app-marmoviewer [url]="detail.marmoview" />
      </div>
    }
  }

</div>
