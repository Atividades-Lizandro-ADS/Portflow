<div class="auth-page">
  <div class="auth-brand">
    <h1 class="auth-brand-logo">Portflow</h1>
  </div>

  <div class="auth-panel">
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <h1 class="auth-logo">Portflow</h1>
      <h2 class="auth-title">Bem-vindo de volta</h2>
      <p class="auth-sub">Entre na sua conta</p>

      <app-text-input
        formControlName="username"
        placeholder="Usuário ou e-mail"
        autocomplete="username"
      />
      <app-text-input
        formControlName="password"
        placeholder="Senha"
        type="password"
        autocomplete="current-password"
      />

      @if (error()) {
        <span class="auth-error">{{ error() }}</span>
      }

      <app-basic-btn label="Entrar" type="submit" [loading]="loading()" />

      <p class="auth-footer">
        Não tem conta? <a routerLink="/sign">Cadastre-se</a>
      </p>
    </form>
  </div>
</div>
