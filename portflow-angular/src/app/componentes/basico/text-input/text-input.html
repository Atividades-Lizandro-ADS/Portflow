@if (multiline) {
  <textarea
    class="text-input"
    [placeholder]="placeholder"
    [attr.maxlength]="maxLength"
    [disabled]="isDisabled"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></textarea>
} @else {
  <input
    class="text-input"
    [type]="type"
    [placeholder]="placeholder"
    [attr.maxlength]="maxLength"
    [disabled]="isDisabled"
    [attr.autocomplete]="autocomplete"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
}
