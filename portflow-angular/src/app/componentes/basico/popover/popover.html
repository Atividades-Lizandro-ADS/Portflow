<div class="popover">
  <div class="popover-trigger" (click)="toggle()">
    <ng-content select="[trigger]" />
  </div>

  <div class="popover-backdrop" [class.popover-backdrop-open]="open()" (click)="close()"></div>

  <div class="popover-panel" [class.popover-panel-open]="open()" [class.popover-panel-up]="direction() === 'up'">
    <div class="popover-handle"></div>
    <ng-content select="[panel]" />
  </div>
</div>
