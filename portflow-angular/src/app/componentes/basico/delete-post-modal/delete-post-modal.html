@if (visible()) {
  <div
    class="delete-post-modal-backdrop"
    animate.enter="modal-backdrop-enter"
    animate.leave="modal-backdrop-leave"
    (click)="onCancel()"
  >
    <div
      class="delete-post-modal-card"
      animate.enter="modal-panel-enter"
      animate.leave="modal-panel-leave"
      (click)="$event.stopPropagation()"
    >
      <i class="bi bi-exclamation-triangle-fill delete-post-modal-icon"></i>
      <h2 class="delete-post-modal-title">{{ title() }}</h2>
      <p class="delete-post-modal-message">
        {{ message() }}
      </p>
      <p class="delete-post-modal-message">
        Para confirmar, digite <span class="delete-post-modal-post-name">{{ itemName() }}</span> abaixo:
      </p>
      <app-no-paste-input
        [ngModel]="confirmText()"
        (ngModelChange)="confirmText.set($event)"
        [placeholder]="itemName()"
        autocomplete="off"
      />
      <div class="delete-post-modal-actions">
        <button class="delete-post-modal-btn-cancel" (click)="onCancel()" [disabled]="loading()">
          Cancelar
        </button>
        <button
          class="delete-post-modal-btn-confirm"
          (click)="onConfirm()"
          [disabled]="!canConfirm() || loading()"
        >
          @if (loading()) {
            <span class="delete-post-modal-spinner"></span>
          } @else {
            {{ confirmLabel() }}
          }
        </button>
      </div>
    </div>
  </div>
}
