<div class="tier-card">
  @if (showActions()) {
    <div class="tier-card-actions">
      <button type="button" class="tier-card-action-btn" (click)="$event.stopPropagation(); edit.emit()">
        <i class="bi bi-pencil"></i>
      </button>
      <button type="button" class="tier-card-action-btn tier-card-action-btn-danger" (click)="$event.stopPropagation(); remove.emit()">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  }
  <div class="tier-card-image-wrap">
    @if (tier().thumb) {
      <img class="tier-card-image" [src]="tier().thumb" [alt]="tier().name" />
    } @else {
      <div class="tier-card-image tier-card-image-placeholder"></div>
    }
  </div>
  <div class="tier-card-body">
    <h3 class="tier-card-title">{{ tier().name }}</h3>
    <p class="tier-card-description">{{ tier().description | textSize:300 }}</p>
    <div class="tier-card-price-row">
      <span class="tier-card-price">{{ priceLabel() }}</span>
      @if (tier().negotiable) {
        <span class="tier-card-negotiable">É negociável · {{ negotiationLabel() }}</span>
      }
    </div>
  </div>
</div>
